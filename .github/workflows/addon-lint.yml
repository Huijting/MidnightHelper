# Data-integrity linter (Design Spec 06): guards that what the code *names* exists —
# missing ns:L/VL keys, unregistered .toc files, duplicate locale keys, search-index
# coverage. HARD checks fail the build; locale parity is reported softly. No network.

name: Addon lint

on:
  push:
    branches: [main]
    paths:
      - "Locales/**"
      - "Modules/**"
      - "*.lua"
      - "*.toc"
      # ⚠️ Every python tool, not just lint_addon.py. The linter IMPORTS tip_audit for
      # check [19], so a change there changes what the build does — and on 4 Sep 2026 a
      # fix to exactly that file triggered no run at all, because it was not on this
      # list. A trigger that misses the file the job depends on tests the wrong thing.
      - "tools/*.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Locales/**"
      - "Modules/**"
      - "*.lua"
      - "*.toc"
      # ⚠️ Every python tool, not just lint_addon.py. The linter IMPORTS tip_audit for
      # check [19], so a change there changes what the build does — and on 4 Sep 2026 a
      # fix to exactly that file triggered no run at all, because it was not on this
      # list. A trigger that misses the file the job depends on tests the wrong thing.
      - "tools/*.py"
      - ".github/workflows/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Addon lint
        run: python tools/lint_addon.py
