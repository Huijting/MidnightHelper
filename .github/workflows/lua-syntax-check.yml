# Compiles every addon Lua file with luac -p (Lua 5.1) to catch syntax errors before release.
# No network access required.

name: Lua syntax check

on:
  push:
    branches: [main]
    paths:
      - "Addons/**"
      - "Locales/**"
      - "Modules/**"
      - "*.lua"
      - "tools/lua_syntax_check.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Addons/**"
      - "Locales/**"
      - "Modules/**"
      - "*.lua"
      - "tools/lua_syntax_check.py"
      - ".github/workflows/**"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Lua syntax check
        run: |
          which luac5.1 || true
          python tools/lua_syntax_check.py
