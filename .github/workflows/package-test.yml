# Manual DRY-RUN of the release packaging — builds the zip but publishes NOTHING.
# The CurseForge upload is skipped by NOT providing CF_API_KEY here (the packager only
# uploads when both the project id AND a token are present). Validates .pkgmeta / .toc /
# exclusions and offers the zip as a downloadable artifact, without touching CurseForge.
#
# Run it: GitHub repo > Actions > "Package test (dry-run, no upload)" > "Run workflow".
# Then download the "MidnightHelper-package" artifact and check the zip.

name: Package test (dry-run, no upload)

on:
  workflow_dispatch: {}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package (no CF_API_KEY => upload is skipped)
        run: |
          curl -sSf https://raw.githubusercontent.com/BigWigsMods/packager/master/release.sh -o /tmp/release.sh
          bash /tmp/release.sh || echo "::warning::packager exited with $?"

      - name: Collect built zip (out of the hidden .release dir so upload-artifact sees it)
        if: always()
        run: |
          mkdir -p artifact
          cp .release/*.zip artifact/ 2>/dev/null || true
          echo "== artifact/ =="
          ls -la artifact || true
          echo "== zip listing (expect MidnightHelper/, no CLAUDE.md/scripts) =="
          for z in artifact/*.zip; do echo "--- $z ---"; unzip -l "$z" || true; done

      - name: Upload built zip as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MidnightHelper-package
          path: artifact/*.zip
          if-no-files-found: warn
