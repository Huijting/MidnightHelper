# Validates that every GuideData.lua leveling tip references a real GUIDE_TIP_* string in GuideTips.lua.
# No network access required.

name: Guide tips audit

on:
  push:
    branches: [main]
    paths:
      - "Addons/**"
      - "Locales/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Addons/**"
      - "Locales/**"
      - "tools/**"
      - ".github/workflows/**"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Run leveling tip consistency check
        run: python tools/audit_guide_spell_tips.py

      - name: Lua syntax check
        run: |
          while IFS= read -r file; do
            luac5.1 -p "$file"
          done < <(find Addons Locales Modules -type f -name "*.lua")
