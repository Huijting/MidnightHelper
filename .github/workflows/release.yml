# Auto-package + upload when a version tag is pushed.
#
# One-time setup (Rob):
#   1. Add `## X-Curse-Project-ID: <id>` to MidnightHelper.toc (the packager reads it).
#   2. On GitHub: Settings > Secrets and variables > Actions > New repository secret
#        Name:  CF_API_KEY
#        Value: your CurseForge API token (legacy.curseforge.com/account/api-tokens)
#
# Releasing after that: bump the .toc version, commit, then push a tag, e.g.:
#   git tag v2.5.0 && git push origin v2.5.0
# The BigWigs packager builds the zip (per .pkgmeta) and uploads it.
#
# --- WAGO (Spec 31 B7), prepared 1 Sep 2026 -------------------------------------------
# The SAME packager run uploads to several stores; this is one build going to more shops,
# not a second copy to maintain. VERIFIED against BigWigsMods/packager's own README:
# the token is WAGO_API_TOKEN and the .toc directive is `## X-Wago-ID: <id>`.
#
# 🔴 THE .toc LINE IS DELIBERATELY NOT ADDED YET, and that is the whole safety of this.
# The packager uploads to Wago only when it finds an X-Wago-ID. Until that line exists,
# the variable below is an empty string and nothing is attempted -- so this change cannot
# break a release. Rob adds the id and the secret, and the line makes it live.
#
# Rob's half:
#   1. addons.wago.io -> sign in -> create the project (name it Midnight Helper).
#   2. addons.wago.io/account/apikeys -> new token.
#   3. GitHub Settings > Secrets and variables > Actions > New repository secret
#        Name: WAGO_API_TOKEN
#   4. Tell me the project id, and I add `## X-Wago-ID: <id>` to the .toc.
#
# --- GITHUB RELEASES, enabled 2 Sep 2026 ----------------------------------------------
# This was deliberately left off with the note "one new shop at a time, so if an upload
# misbehaves we know which one". That reason has now been served: CurseForge has worked for
# months and Wago went up today. So the third one goes on.
#
# 📌 What made it visible: creating the Wago project, Rob's "Create from GitHub release"
# dropdown offered only *Midnight Helper 2.8.1*. Our v* tags start the packager, but nothing
# had created a GitHub Release object since then -- so every tag since 2.8.1 exists as a tag
# and nothing else. That is also why today's first Wago upload had to be done by hand.
#
# ⚠️ NO NEW SECRET. `secrets.GITHUB_TOKEN` is provided by Actions itself; it only needs
# `permissions: contents: write` below, which is why that block is new. VERIFIED against the
# packager's own release.sh rather than its README: it reads
#     [ -z "$github_token" ] && github_token=$GITHUB_OAUTH
#     [ -z "$github_token" ] && github_token=$GITHUB_API_TOKEN
# so GITHUB_API_TOKEN is the right name.
#
# 📌 The same check settled a scare worth recording: the README calls the CurseForge variable
# CF_API_TOKEN while we pass CF_API_KEY. release.sh accepts BOTH, so our working setup was
# never at risk and must not be "fixed".

name: Release to CurseForge, Wago and GitHub

permissions:
  contents: write # create the GitHub Release; the default token is read-only without this

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the packager can build the changelog

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Live since 2 Sep: the .toc now carries X-Wago-ID: rNky4wKa.
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # Built-in token, no setup. Publishes the same zip as a GitHub Release.
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
